{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-white">Novo Dado de Treinamento</h1>
    <p class="mt-2 text-gray-400">Defina um par de pergunta e resposta esperada para treinar o agente.</p>
  </div>

  <form method="post" class="bg-gray-800 rounded-xl p-6 border border-gray-700">
    {% csrf_token %}

    <div class="space-y-5">
      <!-- Input Message -->
      <div>
        <label for="input_message" class="block text-sm font-medium text-gray-300 mb-1">Pergunta (Entrada)</label>
        <textarea id="input_message" name="input_message" rows="4"
                  class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition"
                  placeholder="Ex: Quanto custa o plano premium?" required>{{ item.input_message|default:'' }}</textarea>
      </div>

      <!-- Expected Response -->
      <div>
        <label for="expected_response" class="block text-sm font-medium text-gray-300 mb-1">Resposta Esperada (Saída)</label>
        <textarea id="expected_response" name="expected_response" rows="4"
                  class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition"
                  placeholder="Ex: O plano premium custa R$ 99,90/mês e inclui..." required>{{ item.expected_response|default:'' }}</textarea>
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-gray-700">
      <a href="{% url 'ai_agent:training_list' %}"
         class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition">
        Cancelar
      </a>
      <button type="submit"
              class="px-5 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-semibold rounded-lg transition focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2 focus:ring-offset-gray-900">
        Salvar
      </button>
    </div>
  </form>
</div>
{% endblock %}
