{% extends 'base.html' %}
{% block title %}WhatsApp - CRM{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto" x-data="whatsappApp()" x-init="init()">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white">WhatsApp</h1>
        <span :class="statusClass" class="px-3 py-1 text-sm font-medium rounded-full">
            <span x-text="statusText"></span>
        </span>
    </div>

    <div class="bg-gray-800 rounded-lg border border-gray-700 p-6 mb-6">
        <div class="flex flex-col items-center">
            <template x-if="status === 'unreachable'">
                <div class="text-center py-8">
                    <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                    </svg>
                    <p class="text-gray-400 mb-4">Serviço WhatsApp não está rodando no servidor.</p>
                    <button @click="init()" class="px-4 py-2 bg-yellow-500 text-black rounded-lg hover:bg-yellow-400 font-medium text-sm">
                        Tentar novamente
                    </button>
                </div>
            </template>

            <template x-if="status === 'disconnected'">
                <div class="text-center py-8">
                    <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <p class="text-gray-400 mb-4">Clique no botão abaixo e escaneie o QR Code com seu WhatsApp.</p>
                    <button @click="loadQr()" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-500 font-medium">
                        Conectar WhatsApp
                    </button>
                </div>
            </template>

            <template x-if="status === 'scanning'">
                <div class="text-center py-4">
                    <p class="text-gray-400 mb-4">Escaneie o QR Code com seu WhatsApp:</p>
                    <div class="bg-white p-4 rounded-lg inline-block mb-4">
                        <template x-if="qrImage">
                            <img :src="qrImage" class="w-64 h-64" alt="QR Code">
                        </template>
                        <template x-if="!qrImage">
                            <div class="w-64 h-64 flex items-center justify-center text-gray-400">
                                <svg class="animate-spin w-8 h-8" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                </svg>
                            </div>
                        </template>
                    </div>
                    <p class="text-sm text-gray-500">Mantenha esta página aberta. Após escanear, a conexão será estabelecida automaticamente.</p>
                    <button @click="cancelar()" class="mt-4 px-4 py-2 bg-gray-700 text-gray-300 rounded-lg hover:bg-gray-600 text-sm">
                        Cancelar
                    </button>
                </div>
            </template>

            <template x-if="status === 'connected'">
                <div class="text-center py-8">
                    <svg class="w-16 h-16 text-green-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="text-green-400 text-lg font-medium mb-2">WhatsApp Conectado!</p>
                    <p class="text-gray-400 text-sm">O robô AI está pronto para atender suas conversas.</p>
                </div>
            </template>

            <template x-if="status === 'connected'">
                <div class="mt-6 w-full">
                    <h3 class="text-sm font-medium text-gray-400 mb-2">Como funciona:</h3>
                    <ul class="text-sm text-gray-400 space-y-1 list-disc list-inside">
                        <li>As mensagens recebidas são processadas pelo robô AI</li>
                        <li>O robô responde automaticamente baseado na base de conhecimento</li>
                        <li>Você pode acompanhar as conversas em <a href="{% url 'ai_agent:conversation_list' %}" class="text-yellow-500 hover:underline">Conversas WhatsApp</a></li>
                        <li>Na conversa, você pode assumir o atendimento manualmente</li>
                    </ul>
                </div>
            </template>
        </div>
    </div>

    <template x-if="status === 'connected'">
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <p class="text-xs text-gray-500 text-center">
                Para desconectar, exclua a sessão clicando <button @click="desconectar()" class="text-red-400 hover:underline cursor-pointer">aqui</button>.
            </p>
        </div>
    </template>
</div>

{% block extra_js %}
<script>
function whatsappApp() {
    return {
        status: 'loading',
        qrImage: null,
        pollingInterval: null,
        statusClass: {
            'loading': 'bg-gray-600 text-gray-200',
            'unreachable': 'bg-red-500/20 text-red-400',
            'disconnected': 'bg-yellow-500/20 text-yellow-400',
            'scanning': 'bg-blue-500/20 text-blue-400',
            'connected': 'bg-green-500/20 text-green-400',
        },
        statusText: {
            'loading': 'Carregando...',
            'unreachable': 'Serviço indisponível',
            'disconnected': 'Desconectado',
            'scanning': 'Aguardando leitura',
            'connected': 'Conectado',
        },

        init() {
            this.checkStatus();
        },

        async checkStatus() {
            try {
                const r = await fetch('{% url "ai_agent:whatsapp_status" %}');
                const data = await r.json();
                this.status = data.status;
                if (data.status === 'scanning' && !this.qrImage) {
                    this.loadQr();
                }
                if (data.status === 'connected' || data.status === 'scanning') {
                    this.startPolling();
                } else {
                    this.stopPolling();
                }
            } catch(e) {
                this.status = 'unreachable';
                this.stopPolling();
            }
        },

        async loadQr() {
            this.status = 'scanning';
            this.qrImage = null;
            try {
                const r = await fetch('{% url "ai_agent:whatsapp_qr" %}');
                const data = await r.json();
                if (data.qr) {
                    this.qrImage = data.qr;
                    this.startPolling();
                }
            } catch(e) {
                this.status = 'unreachable';
            }
        },

        startPolling() {
            this.stopPolling();
            this.pollingInterval = setInterval(() => this.checkStatus(), 3000);
        },

        stopPolling() {
            if (this.pollingInterval) {
                clearInterval(this.pollingInterval);
                this.pollingInterval = null;
            }
        },

        cancelar() {
            this.status = 'disconnected';
            this.qrImage = null;
            this.stopPolling();
        },

        desconectar() {
            this.status = 'disconnected';
            this.qrImage = null;
            this.stopPolling();
        }
    };
}
</script>
{% endblock %}
{% endblock %}
