{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-white">{% if item %}Editar Item{% else %}Novo Item{% endif %}</h1>
    <p class="mt-2 text-gray-400">{% if item %}Atualize as informações deste item da base de conhecimento.{% else %}Adicione uma nova peça de conhecimento para o agente.{% endif %}</p>
  </div>

  <form method="post" class="bg-gray-800 rounded-xl p-6 border border-gray-700">
    {% csrf_token %}

    <div class="space-y-5">
      <!-- Category -->
      <div>
        <label for="category" class="block text-sm font-medium text-gray-300 mb-1">Categoria</label>
        <select id="category" name="category"
                class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition">
          <option value="general" {% if item.category == 'general' %}selected{% endif %}>Geral</option>
          <option value="products" {% if item.category == 'products' %}selected{% endif %}>Produtos</option>
          <option value="services" {% if item.category == 'services' %}selected{% endif %}>Serviços</option>
          <option value="pricing" {% if item.category == 'pricing' %}selected{% endif %}>Preços</option>
          <option value="faq" {% if item.category == 'faq' %}selected{% endif %}>FAQ</option>
          <option value="policies" {% if item.category == 'policies' %}selected{% endif %}>Políticas</option>
          <option value="hours" {% if item.category == 'hours' %}selected{% endif %}>Horário de Funcionamento</option>
          <option value="contact" {% if item.category == 'contact' %}selected{% endif %}>Informações de Contato</option>
          <option value="other" {% if item.category == 'other' %}selected{% endif %}>Outro</option>
        </select>
      </div>

      <!-- Question -->
      <div>
        <label for="question" class="block text-sm font-medium text-gray-300 mb-1">Pergunta</label>
        <input type="text" id="question" name="question"
               value="{{ item.question|default:'' }}"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition"
               placeholder="Ex: Horário de funcionamento" required>
      </div>

      <!-- Answer -->
      <div>
        <label for="answer" class="block text-sm font-medium text-gray-300 mb-1">Resposta</label>
        <textarea id="answer" name="answer" rows="10"
                  class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition"
                  placeholder="Escreva a resposta ou informação completa que o agente deve utilizar..." required>{{ item.answer|default:'' }}</textarea>
      </div>

      <!-- Is Active -->
      <div class="flex items-center gap-3 pt-2">
        <input type="checkbox" id="is_active" name="is_active" value="true"
               {% if item.is_active or not item %}checked{% endif %}
               class="w-5 h-5 bg-gray-700 border-gray-600 rounded text-yellow-500 focus:ring-yellow-500 focus:ring-offset-gray-800 cursor-pointer">
        <label for="is_active" class="text-sm font-medium text-gray-300 cursor-pointer">Item ativo</label>
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-gray-700">
      <a href="{% url 'ai_agent:knowledge_list' %}"
         class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition">
        Cancelar
      </a>
      <button type="submit"
              class="px-5 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-semibold rounded-lg transition focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2 focus:ring-offset-gray-900">
        Salvar
      </button>
    </div>
  </form>
</div>
{% endblock %}
