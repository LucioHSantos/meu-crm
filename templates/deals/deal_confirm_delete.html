{% extends "base.html" %}
{% load humanize %}
{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
  <div class="bg-gray-800 rounded-2xl p-8 text-center max-w-md w-full">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-500/10">
      <svg class="h-8 w-8 text-red-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </div>

    <h2 class="mt-4 text-xl font-bold text-white">Excluir Negócio</h2>
    <p class="mt-2 text-sm text-gray-400">Tem certeza que deseja excluir este negócio? Esta ação não pode ser desfeita.</p>

    <div class="mt-6 rounded-xl bg-gray-700 p-4">
      <p class="text-sm font-medium text-white">{{ deal.title }}</p>
      <p class="mt-1 text-lg font-bold text-yellow-400">R$ {{ deal.value|floatformat:2|intcomma }}</p>
    </div>

    <form method="post" class="mt-6 space-y-3">
      {% csrf_token %}
      <button type="submit"
        class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-red-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-red-500 transition">
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
        Excluir
      </button>
      <a href="{% url 'deals:detail' deal.pk %}"
        class="block w-full rounded-lg bg-gray-700 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-600 transition">
        Cancelar
      </a>
    </form>
  </div>
</div>
{% endblock content %}
