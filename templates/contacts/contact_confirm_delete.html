{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div class="card bg-gray-800 rounded-2xl p-8 max-w-md w-full text-center">
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-red-500/10">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-red-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </div>

    <h2 class="text-xl font-bold text-white mb-2">Tem certeza que deseja excluir este contato?</h2>
    <p class="text-gray-300 text-lg mb-2">{{ contact.name }}</p>
    <p class="text-gray-400 text-sm mb-8">Esta ação não pode ser desfeita.</p>

    <form method="post">
      {% csrf_token %}
      <div class="flex items-center justify-center gap-4">
        <a href="{% url 'contacts:detail' contact.pk %}" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white rounded-lg transition-colors">
          Cancelar
        </a>
        <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-lg transition-colors">
          Excluir
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
